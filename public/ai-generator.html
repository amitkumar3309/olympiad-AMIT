<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Question Generator | Admin Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary: #0052FF;
            --dark: #0A1128;
            --bg: #F0F4F8;
            --card-bg: #FFFFFF;
            --border: #E2E8F0;
            --success: #10B981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #1E293B; display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 30px 20px; display: flex; flex-direction: column; gap: 20px; }
        .brand { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #FFD700; margin-bottom: 30px; }
        .nav-item { padding: 12px 15px; border-radius: 10px; color: #CBD5E1; text-decoration: none; display: flex; align-items: center; gap: 10px; font-weight: 500; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
        .nav-item.active { border-left: 4px solid var(--primary); }

        /* MAIN CONTENT */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: var(--dark); }

        /* GENERATOR CARD */
        .generator-card { background: var(--card-bg); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid var(--border); margin-bottom: 30px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control { padding: 12px 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; background: #F8FAFC; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary); background: white; }
        
        .ai-provider-box { display: flex; gap: 15px; margin-bottom: 25px; }
        .provider-label { flex: 1; text-align: center; padding: 15px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.2s; }
        .provider-label input { display: none; }
        .provider-label:hover { background: #F8FAFC; }
        .provider-label.selected { border-color: var(--primary); background: rgba(0,82,255,0.05); color: var(--primary); }

        .btn-generate { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 10px 20px rgba(0,82,255,0.2); transition: 0.3s; }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(0,82,255,0.3); }

        /* RESULTS AREA */
        #resultArea { display: none; margin-top: 30px; }
        .success-banner { background: rgba(16, 185, 129, 0.1); color: var(--success); padding: 15px 20px; border-radius: 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; border: 1px solid rgba(16, 185, 129, 0.2); }
        .q-preview-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .q-preview-card h4 { font-size: 16px; color: var(--dark); margin-bottom: 10px; }
        .q-preview-card .meta { font-size: 12px; color: #64748B; margin-bottom: 15px; display: flex; gap: 10px; }
        .meta span { background: #F1F5F9; padding: 3px 8px; border-radius: 5px; font-weight: 600; }
        .q-preview-card ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .q-preview-card li { background: #F8FAFC; padding: 10px 15px; border-radius: 8px; font-size: 14px; border: 1px solid #E2E8F0; }
        .q-preview-card li.correct { background: rgba(16, 185, 129, 0.1); border-color: var(--success); font-weight: 600; color: var(--success); }

        .loader { display: none; text-align: center; padding: 40px; }
        .spinner { border: 4px solid #E2E8F0; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand"><i class="ph-fill ph-hexagon"></i> AMIT Admin</div>
        <a href="/admin.html" class="nav-item"><i class="ph-fill ph-squares-four"></i> Dashboard</a>
        <a href="#" class="nav-item active"><i class="ph-fill ph-brain"></i> AI Generator</a>
        <a href="#" class="nav-item"><i class="ph-fill ph-database"></i> Question Bank</a>
        <a href="/" class="nav-item" style="margin-top: auto;"><i class="ph-fill ph-globe"></i> View Live Site</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1><i class="ph-fill ph-magic-wand"></i> AI Question Generator Engine</h1>
        </div>

        <div class="generator-card">
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Select AI Provider (Architecture Ready)</label>
                <div class="ai-provider-box">
                    <label class="provider-label selected" onclick="selectProvider(this)">
                        <input type="radio" name="provider" value="Gemini" checked>
                        <i class="ph-fill ph-google-logo" style="font-size: 24px;"></i> Google Gemini
                    </label>
                    <label class="provider-label" onclick="selectProvider(this)">
                        <input type="radio" name="provider" value="OpenAI">
                        <i class="ph-fill ph-cpu" style="font-size: 24px;"></i> OpenAI GPT-4
                    </label>
                    <label class="provider-label" onclick="selectProvider(this)">
                        <input type="radio" name="provider" value="Claude">
                        <i class="ph-fill ph-robot" style="font-size: 24px;"></i> Claude 3.5
                    </label>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Class Level</label>
                    <select id="qClass" class="form-control">
                        <option value="Class 3">Class 3</option>
                        <option value="Class 4">Class 4</option>
                        <option value="Class 5">Class 5</option>
                        <option value="Class 6">Class 6</option>
                        <option value="Class 7">Class 7</option>
                        <option value="Class 8" selected>Class 8</option>
                        <option value="Class 9">Class 9</option>
                        <option value="Class 10">Class 10</option>
                        <option value="Class 11">Class 11</option>
                        <option value="Class 12">Class 12</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Subject / Category</label>
                    <select id="qSubject" class="form-control">
                        <option value="Mathematics">Mathematics</option>
                        <option value="Logical Reasoning">Logical Reasoning</option>
                        <option value="Critical Thinking">Critical Thinking</option>
                        <option value="Puzzles">Puzzles & Brain Teasers</option>
                        <option value="Patterns">Number & Shape Patterns</option>
                        <option value="Vedic Maths">Vedic Maths Tricks</option>
                        <option value="Olympiad Advanced">Olympiad Advanced Math</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Topic / Chapter</label>
                    <input type="text" id="qTopic" class="form-control" placeholder="e.g., Algebra, Number Series" value="Algebra & Series">
                </div>

                <div class="form-group">
                    <label>Difficulty</label>
                    <select id="qDiff" class="form-control">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard (Olympiad Level)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Question Type</label>
                    <select id="qType" class="form-control">
                        <option value="MCQ">Multiple Choice (MCQ)</option>
                        <option value="Assertion Reason">Assertion Reason</option>
                        <option value="True False">True / False</option>
                        <option value="Case Study">Case Study</option>
                        <option value="Mental Math">Mental Math Speed Test</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Number of Questions</label>
                    <input type="number" id="qCount" class="form-control" min="1" max="50" value="5">
                </div>
            </div>

            <!-- YAHAN HAI BUTTON JO MISS HO GAYA THA -->
            <button class="btn-generate" onclick="generateQuestions()">
                <i class="ph-fill ph-magic-wand"></i> Generate & Save to Bank
            </button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <h3 style="color: var(--primary);">AI is thinking and creating questions...</h3>
            <p style="color: #64748B; font-size: 14px;">Please wait while we connect to the LLM architecture.</p>
        </div>

        <div id="resultArea">
            <div class="success-banner" id="successMessage"></div>
            <div id="previewContainer">
                <!-- Previews injected here -->
            </div>
        </div>

    </div>

    <script>
        function selectProvider(element) {
            document.querySelectorAll('.provider-label').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            element.querySelector('input').checked = true;
        }

        async function generateQuestions() {
            const btn = document.querySelector('.btn-generate');
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');
            
            const payload = {
                classLevel: document.getElementById('qClass').value,
                subject: document.getElementById('qSubject').value,
                topic: document.getElementById('qTopic').value,
                difficulty: document.getElementById('qDiff').value,
                questionType: document.getElementById('qType').value,
                count: parseInt(document.getElementById('qCount').value),
                aiProvider: document.querySelector('input[name="provider"]:checked').value
            };

            if(!payload.topic) return alert("Please enter a topic!");

            btn.disabled = true;
            btn.style.opacity = '0.5';
            resultArea.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('http://localhost:8080/api/admin/generate-questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if(result.success) {
                    loader.style.display = 'none';
                    resultArea.style.display = 'block';
                    document.getElementById('successMessage').innerHTML = `<i class="ph-fill ph-check-circle"></i> ${result.message}`;
                    
                    const container = document.getElementById('previewContainer');
                    container.innerHTML = '';
                    
                    result.data.forEach((q, index) => {
                        let optionsHtml = q.options.map(opt => 
                            `<li class="${opt === q.correctAnswer ? 'correct' : ''}">${opt} ${opt === q.correctAnswer ? '✓' : ''}</li>`
                        ).join('');

                        container.innerHTML += `
                            <div class="q-preview-card">
                                <div class="meta">
                                    <span>Q${index + 1}</span>
                                    <span>${q.difficulty}</span>
                                    <span>⏱️ ${q.estimatedTimeSeconds}s</span>
                                </div>
                                <h4>${q.questionText}</h4>
                                <ul>${optionsHtml}</ul>
                                <p style="margin-top: 15px; font-size: 13px; color: #64748B; background: #F8FAFC; padding: 10px; border-radius: 8px;">
                                    <strong>💡 Explanation:</strong> ${q.explanation}
                                </p>
                            </div>
                        `;
                    });
                } else {
                    loader.style.display = 'none';
                    alert("Error: " + (result.error || "Failed to generate"));
                }
            } catch (e) {
                loader.style.display = 'none';
                alert("Failed to connect to AI Server. Make sure server is running.");
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
