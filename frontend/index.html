<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Sets `.theme-dark` before the first paint, so the drawn homepage (vite.prerender.ts) is
      never shown light to a dark reader first — and, on that page only, starts the app once a
      frame has been drawn. Blocking on purpose, and tiny; see the file.
    -->
    <script src="/boot.js"></script>

    <!--
      The title, the description, the share card's Open Graph and Twitter tags and the
      organisation's structured data are written in at build time from `src/lib/brand.ts`
      and `src/lib/pageMeta.ts` by `vite.seo.ts` (Milestone 30, Phase 6), so this file holds
      no second copy of the name, the domain or the contact details. They are in the HTML
      the server sends — a link preview never runs the script. After that, the app keeps the
      title, description, `robots` and canonical link right for each page (`PageMeta`).
    -->
    <title>%AMIT_HOME_TITLE%</title>
    <meta name="description" content="%AMIT_HOME_DESCRIPTION%" />

    <!--
      The icons (Milestone 30, Phase 6), all made from the emblem in `src/assets/logo.png` by
      `scripts/make-brand-images.ts` — they replaced a 1 MB PNG that every visit downloaded
      as its favicon. The theme colours are the light page and the dark one (`--bg` in
      tokens.css; a static file cannot read a token).
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f4f8fe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!--
      Fonts (Milestone 30, Phase 1): **self-hosted**, declared in `src/styles/tokens.css`.

      Plus Jakarta Sans for everything a reader reads, Geist Mono for serials and ids,
      Cinzel for the printed certificate, Caveat for the two handwritten accents. There is
      no third-party font stylesheet any more, so nothing render-blocking stands between
      the HTML and first paint.

      This preload is the one face every page uses, at the Latin subset that every page
      needs. `crossorigin` is required even for a same-origin font: fonts are always
      fetched in CORS mode, and a preload without it is downloaded twice. If the file
      name changes in `tokens.css`, change it here too.
    -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-wght-5.3.0.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Phosphor is the product's single icon library (~87 distinct glyphs across the
      application), used as a webfont: `<i class="ph-bold ph-target" />`, and always
      through `components/ui/Icon.tsx`.

      **Only these two weights are loaded.** `ph-fill`, `ph-light`, `ph-thin` and
      `ph-duotone` have no stylesheet here, so a class naming one of them renders an
      invisible glyph rather than a fallback — which is why `Icon` accepts `regular`
      and `bold` and nothing else.

      `preconnect` was added because the icon font is declared `font-display: block`
      upstream: the browser hides the glyphs until the file arrives, so the round trip
      to open the connection is time the icons are missing.
    -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <!--
      The two stylesheets themselves are added by `src/main.tsx` once the page has loaded
      (Milestone 30, Phase 6): linked here they blocked the first paint of every page, and on
      a slow phone connection that cost the homepage about 2.3 seconds (Lighthouse) for a
      file 99% of which the homepage does not use. An icon is never the only carrier of
      meaning, so a glyph arriving a moment after its words is fine.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
