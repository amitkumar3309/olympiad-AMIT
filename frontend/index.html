<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The brand's full form (Milestone 22, Phase D), owner-supplied on 2026-08-28.

      Spelled out literally here, and *only* here, outside `src/lib/brand.ts`. This file is
      static and served before any JavaScript runs, so it cannot import the constant —
      putting the page title behind a script would cost every visitor a render for a string
      that never changes. **If the name changes, it changes in both places.**
    -->
    <title>A.M.I.T Olympiad — Advance Mathematics and Intelligence Test | National Level Maths Competition</title>
    <meta
      name="description"
      content="A.M.I.T — the Advance Mathematics and Intelligence Test — is a national-level mathematics olympiad for students in Class 3 to Class 12, open to every school board. Free practice, mock tests and a daily challenge; pay once to sit the official Olympiad."
    />
    <!-- Shown when the site is shared into a chat or on social media. -->
    <meta property="og:title" content="A.M.I.T Olympiad — Advance Mathematics and Intelligence Test" />
    <meta
      property="og:description"
      content="A national-level mathematics olympiad for Class 3 to Class 12. Practice, mock tests and a daily challenge are free."
    />
    <meta property="og:type" content="website" />

    <!--
      Fonts (Milestone 23 Phase A; replaced in Milestone 26, replaced again in 27).

      **Bricolage Grotesque for headings, Instrument Sans for everything else.** That
      pairing is the Brightpath reference’s, and the division is load-bearing for this
      product: Bricolage has a lot of character and is tiring at 15px down a column of
      two hundred admin table rows, so it is the display face only.

      **Geist Mono survives for figures** — it is referenced 79 times across 33 files
      for serials, ids and tabular numbers, and a proportional substitute would break
      column alignment. **Cinzel survives for the two logotype surfaces** — the
      landing wordmark and the printed certificate — and nothing else. Geist is gone.

      That is four families where Milestone 26 had three, and unlike that milestone
      this one does **not** get to claim it saved bytes: it costs roughly one extra
      variable face. Both new families are variable, so the cost is one file each
      rather than one per weight.

      These names appear in exactly two places: here, and `--font-body` /
      `--font-heading` in `src/styles/tokens.css`. Nothing in `src/` names a family
      directly, which is what made swapping them a two-file change.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=Geist+Mono:wght@400..600&family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Phosphor is the product's single icon library (~87 distinct glyphs across the
      application), used as a webfont: `<i class="ph-bold ph-target" />`, and always
      through `components/ui/Icon.tsx`.

      **Only these two weights are loaded.** `ph-fill`, `ph-light`, `ph-thin` and
      `ph-duotone` have no stylesheet here, so a class naming one of them renders an
      invisible glyph rather than a fallback — which is why `Icon` accepts `regular`
      and `bold` and nothing else.

      `preconnect` was added because the icon font is declared `font-display: block`
      upstream: the browser hides the glyphs until the file arrives, so the round trip
      to open the connection is time the icons are missing.
    -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
