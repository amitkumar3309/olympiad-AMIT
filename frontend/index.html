<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Dark is the product's default theme (Milestone 26), and these two lines are what
      stop it flashing white before any stylesheet has arrived.

      `color-scheme` tells the browser to paint its own canvas, scrollbars and form
      furniture dark **immediately** — before CSS is parsed, which is exactly the
      window `tokens.css` cannot cover. `dark light` rather than `dark` alone because
      light is still a real theme here; the first value is the preferred one.

      `theme-color` is the mobile browser's own chrome (the address bar on Android
      Chrome, the status area of an installed PWA). Without it a dark page sits under
      a white bar. The value is `--ink-1000`, the page background; if that token
      changes, change this too — a literal is unavoidable in a file served before any
      stylesheet.
    -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#070806" />

    <!--
      The brand's full form (Milestone 22, Phase D), owner-supplied on 2026-08-28.

      Spelled out literally here, and *only* here, outside `src/lib/brand.ts`. This file is
      static and served before any JavaScript runs, so it cannot import the constant —
      putting the page title behind a script would cost every visitor a render for a string
      that never changes. **If the name changes, it changes in both places.**
    -->
    <title>A.M.I.T Olympiad — Advance Mathematics and Intelligence Test | National Level Maths Competition</title>
    <meta
      name="description"
      content="A.M.I.T — the Advance Mathematics and Intelligence Test — is a national-level mathematics olympiad for students in Class 3 to Class 12, open to every school board. Free practice, mock tests and a daily challenge; pay once to sit the official Olympiad."
    />
    <!-- Shown when the site is shared into a chat or on social media. -->
    <meta property="og:title" content="A.M.I.T Olympiad — Advance Mathematics and Intelligence Test" />
    <meta
      property="og:description"
      content="A national-level mathematics olympiad for Class 3 to Class 12. Practice, mock tests and a daily challenge are free."
    />
    <meta property="og:type" content="website" />

    <!--
      Fonts (Milestone 23 Phase A; narrowed in Milestone 26).

      **Inter for the entire interface.** JetBrains Mono for figures. Cinzel for the
      two logotype surfaces — the landing wordmark and the printed certificate — and
      nothing else.

      **Poppins was removed.** It was the heading face, and headings are Inter now; the
      character of a heading here comes from weight and tracking rather than from a
      second family. Nothing in `src/` referenced it once `--font-heading` was
      re-pointed, which is worth checking again before adding any family back.

      Inter is requested as a **variable** range, so 400–800 is one file rather than
      five.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;700&family=Cinzel:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Phosphor is the product's single icon library (~87 distinct glyphs across the
      application), used as a webfont: `<i class="ph-bold ph-target" />`, and always
      through `components/ui/Icon.tsx`.

      **Only these two weights are loaded.** `ph-fill`, `ph-light`, `ph-thin` and
      `ph-duotone` have no stylesheet here, so a class naming one of them renders an
      invisible glyph rather than a fallback — which is why `Icon` accepts `regular`
      and `bold` and nothing else.

      `preconnect` was added because the icon font is declared `font-display: block`
      upstream: the browser hides the glyphs until the file arrives, so the round trip
      to open the connection is time the icons are missing.
    -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
